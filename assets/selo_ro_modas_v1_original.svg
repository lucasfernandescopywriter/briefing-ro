<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&amp;family=Montserrat:wght@500;600;700&amp;display=swap');
      .seal-text {
        font-family: 'Montserrat', sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 5px;
        fill: #3C2A21;
        text-transform: uppercase;
      }
      .seal-monogram {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 92px;
        font-style: italic;
        font-weight: 700;
        fill: #B8736B;
      }
    </style>
    
    <!-- Paths for circular text -->
    <path id="textCircleTop" d="M 50, 200 A 150,150 0 0,1 350, 200" fill="none" stroke="none"/>
    <path id="textCircleBottom" d="M 350, 200 A 150,150 0 0,1 50, 200" fill="none" stroke="none"/>
  </defs>

  <!-- Circular Outer Rings -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="#3C2A21" stroke-width="2.5"/>
  <circle cx="200" cy="200" r="182" fill="none" stroke="#D8A399" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="200" cy="200" r="136" fill="none" stroke="#3C2A21" stroke-width="1.5"/>

  <!-- Curved Text around the Circle -->
  <text class="seal-text">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      ✦ RÔ MODAS ✦
    </textPath>
  </text>
  <text class="seal-text">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      MODA FEMININA · EST. 2023
    </textPath>
  </text>

  <!-- Center Mannequin & Monogram Illustration -->
  <g transform="translate(200, 200)">
    <!-- Mannequin Neck / Top finial -->
    <ellipse cx="0" cy="-68" rx="8" ry="4" fill="#3C2A21"/>
    <rect x="-3" y="-66" width="6" height="12" fill="#3C2A21" rx="2"/>

    <!-- Dressmaker Mannequin Torso Outline -->
    <path d="M -24,-52 
             C -20,-52 -12,-48 0,-48 
             C 12,-48 20,-52 24,-52 
             C 32,-36 34,-20 30,-5 
             C 27,8 20,18 25,32 
             C 28,42 32,54 26,58 
             C 18,62 0,63 0,63 
             C 0,63 -18,62 -26,58 
             C -32,54 -28,42 -25,32 
             C -20,18 -27,8 -30,-5 
             C -34,-20 -32,-36 -24,-52 Z" 
          fill="#F5F1E9" stroke="#3C2A21" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Mannequin inner stitch line -->
    <line x1="0" y1="-46" x2="0" y2="60" stroke="#D8A399" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M -24,4 C -10,12 10,12 24,4" fill="none" stroke="#D8A399" stroke-width="1.2" stroke-dasharray="3,3"/>

    <!-- Intertwined Monogram 'R' -->
    <text x="2" y="28" text-anchor="middle" class="seal-monogram" opacity="0.95">R</text>

    <!-- Stand / Base of the Mannequin -->
    <line x1="0" y1="62" x2="0" y2="92" stroke="#3C2A21" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="0" cy="92" rx="6" ry="3" fill="#3C2A21"/>
    <path d="M 0,92 L -20,112" stroke="#3C2A21" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 0,92 L 20,112" stroke="#3C2A21" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 0,92 L 0,114" stroke="#3C2A21" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
