<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&amp;family=Montserrat:wght@500;600;700&amp;display=swap');
      .seal-text {
        font-family: 'Montserrat', sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 5px;
        fill: #3C2A21;
        text-transform: uppercase;
      }
      .seal-monogram {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 110px;
        font-style: italic;
        font-weight: 700;
        fill: #B8736B;
      }
      .seal-accent {
        fill: #D8A399;
      }
    </style>
    
    <!-- Paths for circular text -->
    <path id="textCircleTop" d="M 50, 200 A 150,150 0 0,1 350, 200" fill="none" stroke="none"/>
    <path id="textCircleBottom" d="M 350, 200 A 150,150 0 0,1 50, 200" fill="none" stroke="none"/>
  </defs>

  <!-- Circular Outer Rings (Primeira Versão da Identidade) -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="#3C2A21" stroke-width="2.5"/>
  <circle cx="200" cy="200" r="182" fill="none" stroke="#D8A399" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="200" cy="200" r="136" fill="none" stroke="#3C2A21" stroke-width="1.5"/>

  <!-- Curved Text around the Circle -->
  <text class="seal-text">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      ✦ RÔ MODAS ✦
    </textPath>
  </text>
  <text class="seal-text">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      MODA FEMININA · EST. 2023
    </textPath>
  </text>

  <!-- Inner Subtle Disc -->
  <circle cx="200" cy="200" r="102" fill="#FAF6F0" stroke="#E8DFD5" stroke-width="1"/>

  <!-- Center Monogram 'R' (Versão Limpa, Sem Manequim) -->
  <g transform="translate(200, 200)">
    <!-- Elegant points above and below -->
    <polygon points="0,-72 3,-68 0,-64 -3,-68" class="seal-accent"/>
    <polygon points="0,64 3,68 0,72 -3,68" class="seal-accent"/>
    
    <!-- Monograma Central R -->
    <text x="2" y="38" text-anchor="middle" class="seal-monogram">R</text>
  </g>
</svg>
